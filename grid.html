<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grid</title>
    <style>
        .border{
            border: solid;
        }
        .blue{
            width:30%;
            background-color:darkblue;
        }
        .col{
            height:400px;
        }
        .dGray{
            width:70%;
            background-color:grey;
        }
        .lGray{
            height:60px;
            background-color:darkgrey;
        }
        .white{
            height:25px;
            background-color:whitesmoke;
        }
        .brown{
            height:25px;
            background-color:brown;
        }
        .next{
            display:flex;
        }
    </style>

  </head>
  <body>
      <div class="container">
        <div class="row white">
        </div>
        <div class="row lGray">
        </div>
        <div class="row next">
            <div class="col blue">
            </div>
            <div class="col dGray">
            </div>
        </div>
        <div class="row brown">
        </div>
      </div>
  </body>
